    <script>
      const sb = supabase.createClient(
        "https://pyoijoamwgkyszlcgblk.supabase.co",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5b2lqb2Ftd2dreXN6bGNnYmxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MTk4NTcsImV4cCI6MjA5NjA5NTg1N30.SFTZ6Ae22Ln4lzYATubf-7h_LdvZxzBPJzxINJuzcZk",
      );
      async function authHeaders() {
        try {
          const { data } = await sb.auth.getSession();
          const token = data?.session?.access_token;
          if (!token) return { "Content-Type": "application/json" };
          return {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          };
        } catch (e) {
          return { "Content-Type": "application/json" };
        }
      }
      (async () => {
        const { data } = await sb.auth.getSession();
        if (!data.session) window.location.href = "/login";
      })();

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #faf8f5;
        --surface: #ffffff;
        --border: #e8e2d9;
        --border2: #f0ebe3;
        --accent: #f97316;
        --text: #1c1917;
        --muted: #78716c;
        --muted2: #a8a29e;
        --r: 12px;
      }
      html.dark {
        --bg: #1c1917;
        --surface: #292524;
        --border: #44403c;
        --border2: #3a3633;
        --accent: #f97316;
        --text: #f5f5f4;
        --muted: #a8a29e;
        --muted2: #78716c;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Figtree", sans-serif;
        min-height: 100vh;
      }
      .page {
        max-width: 760px;

      header {
        display: flex;

      .back-btn {

        align-items: center;

        text-decoration: none;
        font-size: 0.86rem;

        cursor: pointer;
        transition: border-color 0.18s ease;

      .back-btn:hover {

      }
      .logo {

        color: var(--text);

      .logo span {

      }
      .page-title {
        font-family: "Syne", sans-serif;

      .controls {
        display: flex;

      .search-input {

      .group-wrap {

        align-items: center;

        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 9px;

      .group-label {
        font-family: "DM Mono", monospace;
        font-size: 0.7rem;

      .group-select {

        color: var(--text);

  <body>
    <div class="page">
      <header>
        <button
          type="button"
          class="back-btn"
          onclick="window.location.href = '/app'"
        >
          ← Dashboard
        </button>
        <div class="logo">ev<span>u</span>eo</div>
      </header>

      <h1 class="page-title">History</h1>
      <p class="page-sub" id="page-sub">
        All your past waybills — update status, re-download receipts, copy
        tracking IDs.
      </p>

      <div class="controls">
        <input
          type="text"
          class="search-input"
          id="search"
          placeholder="Search sender, receiver, or tracking ID…"
          oninput="onSearchChange()"
        />
        <div class="group-wrap">
          <label class="group-label" for="group-by">Group by</label>
          <select
            class="group-select"
            id="group-by"
            onchange="onGroupChange()"
            title="Group records by period"
          >
            <option value="monthly" selected>Monthly</option>
            <option value="weekly">Weekly</option>
            <option value="daily">Daily</option>
            <option value="none">None</option>
          </select>
        </div>
      </div>

      <div class="meta-row">
        <span id="record-count">Loading…</span>
        <button type="button" class="link-btn" data-action="select-all">
          Select all shown
        </button>
      </div>

      <div id="history-list">
        <div class="loading">
          <span class="spinner"></span> Loading records…
        </div>
      </div>
    </div>

    <div class="bulk-bar" id="bulk-bar" hidden>
      <span class="bulk-count" id="bulk-count">0 selected</span>
      <select class="bulk-select" id="bulk-status" aria-label="New status">
        <option value="picked_up">Mark as Picked up</option>
        <option value="out_for_delivery">Mark as Out for delivery</option>
        <option value="delivered">Mark as Delivered</option>
        <option value="registered">Mark as Registered</option>
      </select>
      <button
        type="button"
        class="bulk-apply"
        id="bulk-apply"
        data-action="bulk-apply"
      >
        Apply
      </button>
      <button type="button" class="bulk-ghost" data-action="bulk-clear">
        Clear
      </button>
      <span class="bulk-msg" id="bulk-msg"></span>
    </div>

    <script>
      // Status taxonomy — kept identical to app.html / verify.html /
      // api/update-status.js so labels and colours stay in sync.
      const STATUS_LABELS = {
        registered: { label: "Registered", bg: "#f5f5f4", fg: "#57534e" },
        picked_up: { label: "Picked up", bg: "#dbeafe", fg: "#1d4ed8" },
        out_for_delivery: {
          label: "Out for delivery",
          bg: "#ffedd5",
          fg: "#c2410c",
        },
        delivered: { label: "Delivered", bg: "#dcfce7", fg: "#15803d" },
      };

      // Theme — mirror whatever the user set on /app.
      (function applyTheme() {
        try {
          if (localStorage.getItem("evueo-theme") === "dark")
            document.documentElement.classList.add("dark");
        } catch (e) {}
      })();

      // Module state — populated once on load, then re-filtered locally.
      let allRecords = [];
      let statusMap = {};
      let isPremium = false;
      let companyName = "Your Logistics Company";
      let companyLogo = null;
      let groupItems = {}; // group key -> selectable tracking numbers
      const selected = new Set(); // tracking numbers ticked for bulk update

      // ── Helpers ──
      function toArray(data) {
        if (Array.isArray(data)) return data;
        if (data && Array.isArray(data.records)) return data.records;
        if (data && Array.isArray(data.data)) return data.data;
        return [];
      }

      // The sheet stores date as "DD/MM/YYYY, HH:MM" (Africa/Lagos). Parse to
      // a real Date so we can group by day/week/month. Returns null if unparseable.
      function parseRecordDate(s) {
        if (!s) return null;
        const datePart = String(s).split(",")[0].trim();
        const [d, m, y] = datePart.split("/").map((x) => parseInt(x, 10));
        if (!d || !m || !y) return null;
        const dt = new Date(y, m - 1, d);
        return isNaN(dt.getTime()) ? null : dt;
      }

      // Group key + display label for a given grouping mode.
      function groupKey(dt, mode) {
        if (!dt) return { key: "unknown", label: "Unknown date" };
        const pad = (n) => String(n).padStart(2, "0");
        const monthNames = [
          "January",
          "February",
          "March",
          "April",
          "May",
          "June",
          "July",
          "August",
          "September",
          "October",
          "November",
          "December",
        ];
        if (mode === "daily") {
          const key = `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
          const label = dt.toLocaleDateString("en-GB", {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric",
          });
          return { key, label };
        }
        if (mode === "weekly") {
          // ISO-ish week — Monday as week start. Good enough for grouping.
          const tmp = new Date(dt);
          const day = tmp.getDay() === 0 ? 6 : tmp.getDay() - 1;
          tmp.setDate(tmp.getDate() - day);
          const end = new Date(tmp);
          end.setDate(end.getDate() + 6);
          const key = `${tmp.getFullYear()}-W${pad(tmp.getMonth() + 1)}${pad(tmp.getDate())}`;
          const label = `Week of ${tmp.getDate()} ${monthNames[tmp.getMonth()].slice(0, 3)} – ${end.getDate()} ${monthNames[end.getMonth()].slice(0, 3)}, ${end.getFullYear()}`;
          return { key, label };
        }
        // monthly (default)
        const key = `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}`;
        const label = `${monthNames[dt.getMonth()]} ${dt.getFullYear()}`;
        return { key, label };
      }

      // ── Load company + status + records on boot ──
      async function loadCompany() {
        const { data } = await sb
          .from("companies")
          .select("company_name, tier, premium_until, logo_url")
          .single();
        if (!data) return;
        companyName = data.company_name || companyName;
        companyLogo = data.logo_url || null;
        const stillPremium =
          data.tier === "premium" &&
          data.premium_until &&
          new Date(data.premium_until) > new Date();
        isPremium = !!stillPremium;
      }

      async function loadStatuses() {
        try {
          const res = await fetch("/api/get-statuses", {
            method: "GET",
            headers: await authHeaders(),
          });
          if (!res.ok) return;
          const data = await res.json();
          const map = {};
          // /api/get-statuses returns a plain array (older code returned
          // { statuses: [...] }); accept both.
          (Array.isArray(data) ? data : data.statuses || []).forEach((s) => {
            if (s.tracking_number)
              map[s.tracking_number] = {
                status: s.status || "registered",
                status_updated_at: s.status_updated_at,
              };
          });
          statusMap = map;
        } catch (e) {}
      }

      async function loadRecords() {
        const res = await fetch("/api/get-records", {
          method: "GET",
          headers: await authHeaders(),
        });
        if (!res.ok) {
          if (res.status === 401) {
            window.location.href = "/login";
            return [];
          }
          throw new Error("Could not load records.");
        }
        return toArray(await res.json());
      }

      async function boot() {
        try {
          await Promise.all([loadCompany(), loadStatuses()]);
          allRecords = await loadRecords();
          render();
        } catch (e) {
          document.getElementById("history-list").innerHTML =
            `<div class="empty"><div class="empty-icon">⚠️</div><div>${esc((e && e.message) || "Failed to load records.")}</div></div>`;
        }
      }

      // ── Render pipeline ──
      function currentFiltered() {
        const q = (document.getElementById("search").value || "")
          .trim()
          .toLowerCase();
        if (!q) return allRecords;
        return allRecords.filter((r) => {
          const hay = [r.sender, r.receiver, r.tracking_number]
            .map((x) => String(x || "").toLowerCase())
            .join(" ");
          return hay.includes(q);
        });
      }

      function render() {
        const mode = document.getElementById("group-by").value;
        const list = [...currentFiltered()].reverse(); // newest first
        const out = document.getElementById("history-list");
        const countEl = document.getElementById("record-count");

        if (!allRecords.length) {
          countEl.textContent = "0 records";
          out.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><div>No records yet. Analyze your first waybill on the dashboard.</div></div>`;
          return;
        }
        if (!list.length) {
          countEl.textContent = `0 of ${allRecords.length} match`;
          out.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><div>No matches. Try a different search.</div></div>`;
          return;
        }
        countEl.textContent =
          list.length === allRecords.length
            ? `${list.length} ${list.length === 1 ? "record" : "records"}`
            : `${list.length} of ${allRecords.length} match`;

        if (mode === "none") {
          out.innerHTML = `<div class="group"><div class="group-body">${list.map(recordHTML).join("")}</div></div>`;
          return;
        }

        // Group while preserving (already-reversed) order.
        const groups = [];
        const idx = {};
        for (const r of list) {
          const dt = parseRecordDate(r.date);
          const { key, label } = groupKey(dt, mode);
          if (idx[key] === undefined) {
            idx[key] = groups.length;
            groups.push({ key, label, items: [] });
          }
          groups[idx[key]].items.push(r);
        }
        groupItems = {};
        groups.forEach((g) => {
          groupItems[g.key] = g.items
            .map((r) => r.tracking_number)
            .filter(isRealTracking);
        });
        out.innerHTML = groups
          .map(
            (g, i) => `
            <div class="group${i === 0 ? "" : " collapsed"}" data-key="${esc(g.key)}">
              <div class="group-header" data-action="toggle-group">
                <div>
                  ${groupItems[g.key].length ? `<label class="pick" style="margin-right:10px;vertical-align:middle;"><input type="checkbox" class="pick-box group-pick" data-action="pick-group" data-key="${esc(g.key)}" aria-label="Select all in ${esc(g.label)}"></label>` : ""}
                  <span class="group-title">${esc(g.label)}</span>
                  <span class="group-chevron">▾</span>
                </div>
                <span class="group-count">${g.items.length} ${g.items.length === 1 ? "record" : "records"}</span>
              </div>
              <div class="group-body">${g.items.map(recordHTML).join("")}</div>
            </div>`,
          )
          .join("");
        refreshGroupChecks();
      }

      function toggleGroup(headerEl) {
        const group = headerEl.parentElement;
        group.classList.toggle("collapsed");
      }

      // ── Record card ──
      // Everything on this page comes from pasted waybill text, so it is always
      // escaped before it goes into HTML. Buttons use data-* attributes plus one
      // delegated listener (no inline onclick strings built from record data).
      function esc(v) {
        return String(v ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      // The sheet keeps the fee as typed ("3500"); show it as ₦3,500.
      function fmtFee(v) {
        const raw = String(v ?? "").trim();
        if (!/^(\u20A6|NGN|N)?\s*\d[\d,]*(\.\d+)?$/i.test(raw)) return raw;
        const n = Number(raw.replace(/[^0-9.]/g, ""));
        return Number.isFinite(n)
          ? "\u20A6" + n.toLocaleString("en-US", { maximumFractionDigits: 2 })
          : raw;
      }
      function isRealTracking(t) {
        return !!t && t !== "N/A";
      }
      function fmtDesc(raw) {
        if (!raw || raw === "N/A") return "";
        return String(raw);
      }
      function recordHTML(r) {
        const tracking = r.tracking_number || "";
        const real = isRealTracking(tracking);
        const current = (statusMap[tracking] || {}).status || "registered";
        const s = STATUS_LABELS[current] || STATUS_LABELS.registered;
        const statusControl = real
          ? `<div class="status-row">
              <span class="status-pill" style="background:${s.bg};color:${s.fg};">${s.label}</span>
              <select class="status-select" data-action="status" data-tracking="${esc(tracking)}">
                ${Object.entries(STATUS_LABELS)
                  .map(
                    ([v, info]) =>
                      `<option value="${v}"${v === current ? " selected" : ""}>${info.label}</option>`,
                  )
                  .join("")}
              </select>
            </div>`
          : `<div class="status-row"></div>`;

        // Premium-only extra rows. Only render lines with real values so the
        // card stays clean when fields are missing.
        const premiumBits = [];
        if (isPremium) {
          const fee = r.delivery_fee && r.delivery_fee !== "N/A";
          const wt = r.weight && r.weight !== "N/A";
          const pay = r.payment_status && r.payment_status !== "N/A";
          if (fee || wt || pay) {
            const parts = [];
            if (fee)
              parts.push(
                `<span><strong>Fee:</strong> ${esc(fmtFee(r.delivery_fee))}</span>`,
              );
            if (wt)
              parts.push(
                `<span><strong>Weight:</strong>${esc(r.weight)}</span>`,
              );
            if (pay)
              parts.push(
                `<span><strong>${esc(r.payment_status)}</strong></span>`,
              );
            premiumBits.push(
              `<div class="premium-row">${parts.join("")}</div>`,
            );
          }
          if (r.delivery_address && r.delivery_address !== "N/A") {
            premiumBits.push(
              `<div class="premium-address">${esc(r.delivery_address)}</div>`,
            );
          }
          if (r.landmark && r.landmark !== "N/A") {
            premiumBits.push(
              `<div class="premium-landmark">${esc(r.landmark)}</div>`,
            );
          }
        }

        const actions = `<div class="actions">
          ${real ? `<button class="action-btn" data-action="copy" data-tracking="${esc(tracking)}" title="Copy tracking ID">⧉ Copy</button>` : ""}
          <button class="action-btn" data-action="receipt" data-idx="${allRecords.indexOf(r)}" title="Re-download PDF receipt">⬇ Receipt</button>
        </div>`;

        const pick = real
          ? `<label class="pick" style="margin-right:10px;"><input type="checkbox" class="pick-box" data-action="pick" data-tracking="${esc(tracking)}"${selected.has(tracking) ? " checked" : ""} aria-label="Select ${esc(tracking)}"></label>`
          : "";

        return `<div class="record${selected.has(tracking) && real ? " is-selected" : ""}" data-tracking="${esc(tracking)}">
          <div class="record-top">
            <div class="record-lead">${pick}<div class="record-route">${esc(r.sender || "?")}<span class="arrow">→</span>${esc(r.receiver || "?")}</div></div>
            <div class="record-date">${esc((r.date || "").split(",")[0])}</div>
          </div>
          ${fmtDesc(r.description) ? `<div class="record-items">${esc(fmtDesc(r.description))}</div>` : ""}
          <div class="record-tracking">⬡ ${esc(tracking || "N/A")}</div>
          ${premiumBits.join("")}
          <div class="record-bottom">
            ${statusControl}
            ${actions}
          </div>
        </div>`;
      }

      // We pass the record index (into allRecords) instead of stringifying the
      // full object into an HTML attribute. Safer + smaller DOM.
      function recordIndexAttr(r) {
        return allRecords.indexOf(r);
      }

      // ── Actions ──
      // Repaint the pill and dropdown of every card for this tracking number.
      function paintStatus(tracking) {
        const st = (statusMap[tracking] || {}).status || "registered";
        const info = STATUS_LABELS[st] || STATUS_LABELS.registered;
        document.querySelectorAll(".record").forEach((card) => {
          if (card.dataset.tracking !== tracking) return;
          const pill = card.querySelector(".status-pill");
          if (pill) {
            pill.textContent = info.label;
            pill.style.background = info.bg;
            pill.style.color = info.fg;
          }
          const sel = card.querySelector(".status-select");
          if (sel) sel.value = st;
        });
      }

      async function updateStatus(selectEl, tracking) {
        const newStatus = selectEl.value;
        if (!STATUS_LABELS[newStatus]) return;
        const prev = (statusMap[tracking] || {}).status || "registered";
        selectEl.disabled = true;
        try {
          const res = await fetch("/api/update-status", {
            method: "POST",
            headers: await authHeaders(),
            body: JSON.stringify({
              tracking_number: tracking,
              status: newStatus,
            }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok)
            throw new Error(data.error || "Could not update status.");
          statusMap[tracking] = {
            status: data.record?.status || newStatus,
            status_updated_at:
              data.record?.status_updated_at || new Date().toISOString(),
          };
          paintStatus(tracking);
        } catch (e) {
          selectEl.value = prev;
          alert(e.message || "Could not update status.");
        } finally {
          selectEl.disabled = false;
        }
      }

      // ── Bulk select ──
      function syncSelectionUI() {
        document.querySelectorAll(".record").forEach((card) => {
          const on = selected.has(card.dataset.tracking);
          card.classList.toggle("is-selected", on);
          const box = card.querySelector(".pick-box");
          if (box) box.checked = on;
        });
        refreshGroupChecks();
        const bar = document.getElementById("bulk-bar");
        document.getElementById("bulk-count").textContent =
          `${selected.size} selected`;
        bar.hidden = selected.size === 0;
        if (selected.size) document.getElementById("bulk-msg").textContent = "";
      }
      function refreshGroupChecks() {
        document.querySelectorAll(".group-pick").forEach((box) => {
          const list = groupItems[box.dataset.key] || [];
          box.checked = list.length > 0 && list.every((t) => selected.has(t));
        });
      }
      function setPicked(tracking, on) {
        if (!isRealTracking(tracking)) return;
        if (on) selected.add(tracking);
        else selected.delete(tracking);
      }

      async function applyBulk() {
        const status = document.getElementById("bulk-status").value;
        const info = STATUS_LABELS[status];
        const list = [...selected];
        if (!info || !list.length) return;
        const btn = document.getElementById("bulk-apply");
        const msg = document.getElementById("bulk-msg");
        btn.disabled = true;
        btn.textContent = "Updating…";
        let done = 0;
        let missed = 0;
        try {
          for (let i = 0; i < list.length; i += 100) {
            const chunk = list.slice(i, i + 100);
            const res = await fetch("/api/update-status", {
              method: "POST",
              headers: await authHeaders(),
              body: JSON.stringify({ tracking_numbers: chunk, status }),
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok)
              throw new Error(data.error || "Could not update status.");
            (data.updated || []).forEach((u) => {
              statusMap[u.tracking_number] = {
                status: u.status,
                status_updated_at: u.status_updated_at,
              };
              paintStatus(u.tracking_number);
            });
            done += data.count || 0;
            missed += (data.not_found || []).length;
          }
          selected.clear();
          syncSelectionUI();
          const bar = document.getElementById("bulk-bar");
          bar.hidden = false;
          document.getElementById("bulk-count").textContent = "";
          msg.textContent =
            `✓ ${done} marked ${info.label}` +
            (missed ? ` (${missed} not found)` : "");
          setTimeout(() => {
            if (!selected.size) bar.hidden = true;
          }, 2500);
        } catch (e) {
          alert(
            (e.message || "Could not update status.") +
              (done ? ` ${done} were updated before the error.` : ""),
          );
        } finally {
          btn.disabled = false;
          btn.textContent = "Apply";
        }
      }

      async function copyTracking(tracking, btn) {
        try {
          await navigator.clipboard.writeText(tracking);
          const original = btn.innerHTML;
          btn.innerHTML = "✓ Copied";
          setTimeout(() => {
            btn.innerHTML = original;
          }, 1400);
        } catch (e) {
          alert("Tracking: " + tracking);
        }
      }

      async function redownload(btn, idx) {
        const r = allRecords[idx];
        if (!r) return;
        const original = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = `<span class="spinner"></span> PDF…`;

        // Mirror app.html buildReceiptCard — same field shape the
        // /api/generate-receipt endpoint expects.
        const now = new Date().toLocaleString("en-GB", {
          timeZone: "Africa/Lagos",
          day: "2-digit",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
        const payload = {
          companyName,
          tracking: r.tracking_number || "N/A",
          sender: r.sender || "N/A",
          receiver: r.receiver || "N/A",
          receiverPhone: r.receiver_phone || "",
          landmark: r.landmark || "",
          items: r.description || "N/A",
          dateStr: (r.date || now).replace(", ", "\n"),
          isPaid: isPremium,
          logoUrl: isPremium ? companyLogo : null,
          weight: r.weight || "",
          deliveryAddress: r.delivery_address || "",
          origin: r.origin || "",
          destination: r.destination || "",
          deliveryFee: r.delivery_fee || "",
          paymentStatus: r.payment_status || "",
        };

        try {
          const res = await fetch("/api/generate-receipt", {
            method: "POST",
            headers: await authHeaders(),
            body: JSON.stringify(payload),
          });
          if (!res.ok) throw new Error("Receipt failed.");
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `${r.tracking_number || "receipt"}.pdf`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        } catch (e) {
          alert(e.message || "Could not generate receipt.");
        } finally {
          btn.disabled = false;
          btn.innerHTML = original;
        }
      }

      function onSearchChange() {
        render();
      }
      function onGroupChange() {
        render();
      }

      document.addEventListener("change", (ev) => {
        const el = ev.target;
        const act = el.dataset && el.dataset.action;
        if (act === "status") {
          updateStatus(el, el.dataset.tracking);
        } else if (act === "pick") {
          setPicked(el.dataset.tracking, el.checked);
          syncSelectionUI();
        } else if (act === "pick-group") {
          (groupItems[el.dataset.key] || []).forEach((t) =>
            setPicked(t, el.checked),
          );
          syncSelectionUI();
        }
      });

      document.addEventListener("click", (ev) => {
        const btn = ev.target.closest("[data-action]");
        if (!btn) return;
        const act = btn.dataset.action;
        if (act === "copy") copyTracking(btn.dataset.tracking, btn);
        else if (act === "receipt")
          redownload(btn, parseInt(btn.dataset.idx, 10));
        else if (act === "toggle-group") {
          if (ev.target.closest(".group-pick")) return;
          toggleGroup(btn);
        } else if (act === "select-all") {
          currentFiltered().forEach((r) => setPicked(r.tracking_number, true));
          syncSelectionUI();
        } else if (act === "bulk-apply") applyBulk();
        else if (act === "bulk-clear") {
          selected.clear();
          syncSelectionUI();
        }
      });

      boot();
    </script>
  </body>
</html>
