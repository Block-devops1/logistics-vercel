<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evueo — Reset Password</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Figtree:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #faf8f5;
        --surface: #fff;
        --border: #e8e2d9;
        --accent: #f97316;
        --accent2: #ea6c00;
        --text: #1c1917;
        --muted: #78716c;
        --muted2: #a8a29e;
        --error: #dc2626;
        --success: #16a34a;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Figtree", sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: radial-gradient(
          circle,
          rgba(0, 0, 0, 0.045) 1px,
          transparent 1px
        );
        background-size: 24px 24px;
        pointer-events: none;
        z-index: 0;
      }
      body::after {
        content: "";
        position: fixed;
        top: -160px;
        left: 50%;
        transform: translateX(-50%);
        width: 600px;
        height: 360px;
        background: radial-gradient(
          ellipse,
          rgba(249, 115, 22, 0.1) 0%,
          transparent 70%
        );
        pointer-events: none;
        z-index: 0;
      }
      nav {
        position: relative;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 32px;
        border-bottom: 1px solid var(--border);
        background: rgba(250, 248, 245, 0.9);
        backdrop-filter: blur(10px);
      }
      .logo {
        font-family: "Syne", sans-serif;
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        color: var(--text);
        text-decoration: none;
      }
      .logo em {
        color: var(--accent);
        font-style: normal;
      }
      .nav-signup {
        font-size: 0.88rem;
        color: var(--muted);
        text-decoration: none;
        font-weight: 500;
      }
      .nav-signup span {
        color: var(--accent);
        font-weight: 600;
      }

      main {
        position: relative;
        z-index: 1;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px 60px;
      }

      .login-wrap {
        width: 100%;
        max-width: 420px;
      }

      .login-header {
        text-align: center;
        margin-bottom: 28px;
        animation: fadeUp 0.4s ease both;
      }
      .login-header h1 {
        font-family: "Syne", sans-serif;
        font-size: 1.9rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
      }
      .login-header p {
        font-size: 0.9rem;
        color: var(--muted);
      }

      .login-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 4px 28px rgba(0, 0, 0, 0.07);
        animation: fadeUp 0.45s ease 0.1s both;
      }

      .form-group {
        margin-bottom: 18px;
      }
      label {
        display: block;
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 6px;
      }

      input[type="email"],
      input[type="password"] {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 9px;
        color: var(--text);
        font-family: "Figtree", sans-serif;
        font-size: 0.92rem;
        padding: 12px 14px;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      input:focus {
        border-color: rgba(249, 115, 22, 0.5);
        box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.07);
      }
      input::placeholder {
        color: var(--muted2);
      }

      .alert {
        border-radius: 9px;
        padding: 12px 16px;
        margin-bottom: 18px;
        font-size: 0.85rem;
        display: none;
      }
      .alert.show {
        display: block;
        animation: fadeUp 0.3s ease;
      }
      .alert-error {
        background: rgba(220, 38, 38, 0.06);
        border: 1px solid rgba(220, 38, 38, 0.2);
        color: var(--error);
      }
      .alert-success {
        background: rgba(22, 163, 74, 0.06);
        border: 1px solid rgba(22, 163, 74, 0.2);
        color: var(--success);
      }

      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        background: var(--accent);
        color: #fff;
        font-family: "Figtree", sans-serif;
        font-weight: 700;
        font-size: 0.95rem;
        border: none;
        padding: 13px 20px;
        border-radius: 9px;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.15s,
          box-shadow 0.2s;
        box-shadow: 0 2px 12px rgba(249, 115, 22, 0.3);
      }
      .btn:hover:not(:disabled) {
        background: var(--accent2);
        transform: translateY(-1px);
        box-shadow: 0 4px 20px rgba(249, 115, 22, 0.4);
      }
      .btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none;
      }

      .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.65s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .hint {
        font-size: 0.78rem;
        color: var(--muted);
        margin-top: -8px;
        margin-bottom: 6px;
      }

      .signup-link {
        text-align: center;
        font-size: 0.85rem;
        color: var(--muted);
        margin-top: 20px;
      }
      .signup-link a {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
      }
      .signup-link a:hover {
        text-decoration: underline;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 480px) {
        nav {
          padding: 14px 18px;
        }
        .login-card {
          padding: 22px 18px;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="/" class="logo">ev<em>u</em>eo</a>
      <a href="/login" class="nav-signup">Back to <span>Sign in</span></a>
    </nav>

    <main>
      <div class="login-wrap">
        <div class="login-header">
          <h1 id="page-title">Reset your password</h1>
          <p id="page-sub">
            Enter your email and we'll send you a reset link.
          </p>
        </div>

        <div class="login-card">
          <div id="alert" class="alert"></div>

          <!-- STATE 1: Request a reset link -->
          <div id="request-card">
            <div class="form-group">
              <label>Email address</label>
              <input
                type="email"
                id="email"
                placeholder="you@yourcompany.com"
                onkeydown="if (event.key === 'Enter') requestReset();"
              />
            </div>
            <button class="btn" id="request-btn" onclick="requestReset()">
              Send reset link
            </button>
          </div>

          <!-- STATE 2: Set a new password (after clicking the email link) -->
          <div id="update-card" style="display: none">
            <div class="form-group">
              <label>New password</label>
              <input
                type="password"
                id="new-password"
                placeholder="At least 8 characters"
              />
            </div>
            <div class="form-group">
              <label>Confirm new password</label>
              <input
                type="password"
                id="confirm-password"
                placeholder="Re-enter your new password"
                onkeydown="if (event.key === 'Enter') updatePassword();"
              />
            </div>
            <button class="btn" id="update-btn" onclick="updatePassword()">
              Update password
            </button>
          </div>
        </div>

        <div class="signup-link">
          Remembered it? <a href="/login">Back to sign in</a>
        </div>
      </div>
    </main>

    <script>
      const sb = supabase.createClient(
        "https://pyoijoamwgkyszlcgblk.supabase.co",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5b2lqb2Ftd2dreXN6bGNnYmxrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MTk4NTcsImV4cCI6MjA5NjA5NTg1N30.SFTZ6Ae22Ln4lzYATubf-7h_LdvZxzBPJzxINJuzcZk",
      );

      const alertBox = document.getElementById("alert");
      function showAlert(msg, type) {
        alertBox.className = `alert alert-${type} show`;
        alertBox.textContent = msg;
      }
      function clearAlert() {
        alertBox.className = "alert";
      }

      // When the user arrives via the password-recovery email link, supabase-js
      // parses the token from the URL and fires PASSWORD_RECOVERY. Switch the UI
      // to the "set a new password" state.
      function showUpdateState() {
        document.getElementById("request-card").style.display = "none";
        document.getElementById("update-card").style.display = "block";
        document.getElementById("page-title").textContent =
          "Choose a new password";
        document.getElementById("page-sub").textContent =
          "Enter a new password for your account.";
      }

      sb.auth.onAuthStateChange((event) => {
        if (event === "PASSWORD_RECOVERY") showUpdateState();
      });

      // Fallback: the recovery link puts "type=recovery" in the URL hash. If the
      // event hasn't fired yet, detect it directly so the form still appears.
      if (window.location.hash.includes("type=recovery")) showUpdateState();

      // STATE 1 — send the reset email
      async function requestReset() {
        const btn = document.getElementById("request-btn");
        const email = document.getElementById("email").value.trim();
        clearAlert();

        if (!email) {
          showAlert("Please enter your email address.", "error");
          return;
        }

        btn.disabled = true;
        btn.innerHTML = `<div class="spinner"></div> Sending…`;

        const { error } = await sb.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + "/reset-password",
        });

        if (error) {
          showAlert(error.message, "error");
          btn.disabled = false;
          btn.innerHTML = "Send reset link";
          return;
        }

        showAlert(
          "✅ If that email is registered, a reset link is on its way. Check your inbox (and spam).",
          "success",
        );
        btn.innerHTML = "Reset link sent";
      }

      // STATE 2 — set the new password
      async function updatePassword() {
        const btn = document.getElementById("update-btn");
        const pw = document.getElementById("new-password").value;
        const confirm = document.getElementById("confirm-password").value;
        clearAlert();

        if (pw.length < 8) {
          showAlert("Password must be at least 8 characters.", "error");
          return;
        }
        if (pw !== confirm) {
          showAlert("Passwords do not match.", "error");
          return;
        }

        btn.disabled = true;
        btn.innerHTML = `<div class="spinner"></div> Updating…`;

        const { error } = await sb.auth.updateUser({ password: pw });

        if (error) {
          showAlert(error.message, "error");
          btn.disabled = false;
          btn.innerHTML = "Update password";
          return;
        }

        showAlert(
          "✅ Password updated! Redirecting you to the app…",
          "success",
        );
        setTimeout(() => {
          window.location.href = "/app";
        }, 1800);
      }
    </script>
  </body>
</html>
